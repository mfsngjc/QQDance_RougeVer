<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ炫舞 - 双人对战模式</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden;font-family:'Arial',sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;user-select:none}
canvas{display:block}
#startScreen{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:#fff;text-align:center}
#startScreen h1{font-size:52px;background:linear-gradient(135deg,#ff6fd8,#3813c2,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;letter-spacing:4px}
#startScreen .subtitle{font-size:18px;color:#aaa;margin-bottom:40px}
#startBtn{padding:16px 60px;font-size:22px;border:none;border-radius:50px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;cursor:pointer;transition:all .3s;letter-spacing:2px;box-shadow:0 4px 20px rgba(102,126,234,.4)}
#startBtn:hover{transform:scale(1.08);box-shadow:0 6px 30px rgba(102,126,234,.6)}
.difficulty-section{margin-bottom:30px}
.difficulty-label{font-size:15px;color:#99aabb;margin-bottom:14px;letter-spacing:1px}
.difficulty-btns{display:flex;gap:14px;justify-content:center}
.diff-btn{padding:10px 26px;font-size:15px;border:2px solid rgba(100,120,200,0.3);border-radius:30px;background:rgba(30,35,70,0.6);color:#8899bb;cursor:pointer;transition:all .3s;letter-spacing:1px;position:relative;overflow:hidden}
.diff-btn:hover{border-color:rgba(100,140,255,0.5);color:#aabbdd;background:rgba(40,50,90,0.8)}
.diff-btn.selected{border-color:transparent;color:#fff;font-weight:bold}
.diff-btn.easy.selected{background:linear-gradient(135deg,#44cc88,#22aa66);box-shadow:0 2px 16px rgba(68,204,136,0.4)}
.diff-btn.normal.selected{background:linear-gradient(135deg,#4488ff,#3366dd);box-shadow:0 2px 16px rgba(68,136,255,0.4)}
.diff-btn.hard.selected{background:linear-gradient(135deg,#ff4466,#cc2244);box-shadow:0 2px 16px rgba(255,68,102,0.4)}
.diff-desc{font-size:12px;color:#667;margin-top:10px;min-height:18px;transition:all .3s}
.controls-info{margin-top:24px;font-size:14px;color:#777;line-height:2}
.controls-info span{color:#aaddff}
</style>
</head>
<body>
<div id="startScreen">
  <h1>QQ炫舞</h1>
  <div class="subtitle">双 人 对 战 模 式</div>
  <div class="difficulty-section">
    <div class="difficulty-label">选择电脑难度</div>
    <div class="difficulty-btns">
      <button class="diff-btn easy" data-diff="easy" onclick="selectDiff('easy')">简 单</button>
      <button class="diff-btn normal selected" data-diff="normal" onclick="selectDiff('normal')">普 通</button>
      <button class="diff-btn hard" data-diff="hard" onclick="selectDiff('hard')">困 难</button>
    </div>
    <div class="diff-desc" id="diffDesc">AI会偶尔失误，适合休闲对战</div>
  </div>
  <button id="startBtn">开始对战</button>
  <div class="controls-info">
    <span>↑ ↓ ← →</span> 输入方向音符 &nbsp;|&nbsp; <span>空格</span> 关键音（节拍器踩点）<br>
    你控制左半屏，电脑控制右半屏，比拼谁的分数更高！
  </div>
</div>
<canvas id="gameCanvas"></canvas>
<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d'),DPR=window.devicePixelRatio||1;
function resizeCanvas(){canvas.width=window.innerWidth*DPR;canvas.height=window.innerHeight*DPR;canvas.style.width=window.innerWidth+'px';canvas.style.height=window.innerHeight+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
resizeCanvas();window.addEventListener('resize',resizeCanvas);
const W=()=>window.innerWidth,H=()=>window.innerHeight,HALF_W=()=>W()/2;
const BPM=120,BEAT_MS=60000/BPM,MEASURE_MS=BEAT_MS*4;
const DIR_MAP={'ArrowUp':'↑','ArrowDown':'↓','ArrowLeft':'←','ArrowRight':'→'};
const DIR_KEYS=['↑','↓','←','→'];
const JUDGE_PERFECT=50,JUDGE_GREAT=100,JUDGE_GOOD=150,JUDGE_BAD=200;
const TRACK_DURATION=MEASURE_MS,JUDGE_LINE_RATIO=4/5;

let gameState='idle',currentRound=0,totalRounds=20,rounds=[];
let gameStartTime=0,roundStartTime=0,beatCount=0,lastBeatTime=0,beatFlash=0,keyBeatFlash=0;

// ========== Difficulty System ==========
const DIFF_CONFIG={
  easy:{
    label:'简单',
    // 输入正确率：50%~62% (随回合缓慢提升)
    inputBaseAcc:0.50, inputGrowth:0.006, inputMaxAcc:0.62,
    // 输入速度(ms)：较慢
    inputBaseInterval:230, inputSpeedGrowth:3, inputMinInterval:160,
    // 判定分布: 50% miss, 40% good, 7% great, 3% perfect
    judgeDist:{miss:0.50, good:0.40, great:0.07, perfect:0.03},
    // 标签颜色
    color:'#44cc88'
  },
  normal:{
    label:'普通',
    // 输入正确率：68%~82%
    inputBaseAcc:0.68, inputGrowth:0.007, inputMaxAcc:0.82,
    // 输入速度(ms)：中等
    inputBaseInterval:180, inputSpeedGrowth:5, inputMinInterval:100,
    // 判定分布: 15% miss, 30% good, 35% great, 20% perfect
    judgeDist:{miss:0.15, good:0.30, great:0.35, perfect:0.20},
    color:'#4488ff'
  },
  hard:{
    label:'困难',
    // 输入正确率：85%~96%
    inputBaseAcc:0.85, inputGrowth:0.006, inputMaxAcc:0.96,
    // 输入速度(ms)：很快
    inputBaseInterval:120, inputSpeedGrowth:4, inputMinInterval:55,
    // 判定分布: 3% miss, 10% good, 32% great, 55% perfect
    judgeDist:{miss:0.03, good:0.10, great:0.32, perfect:0.55},
    color:'#ff4466'
  }
};
let selectedDifficulty='normal';
const DIFF_DESCS={easy:'AI经常输错方向键，判定也不太准',normal:'AI会偶尔失误，适合休闲对战',hard:'AI几乎不犯错，判定精准，强力挑战！'};
function selectDiff(d){
  selectedDifficulty=d;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('selected'));
  document.querySelector(`.diff-btn.${d}`).classList.add('selected');
  document.getElementById('diffDesc').textContent=DIFF_DESCS[d];
}

// ========== PlayerState ==========
class PlayerState{
  constructor(side,isAI=false){
    this.side=side;this.isAI=isAI;this.score=0;this.combo=0;this.maxCombo=0;
    this.inputIndex=0;this.inputComplete=false;this.spaceProtected=true;
    this.roundJudged=false;this.currentJudgment=null;this.trackProgress=0;
    this.trackAfterImages=[];this.judgmentDisplay=null;this.comboDisplay=null;
    this.particles=[];this.fireParticles=[];this.spotlightEffect=null;
    this.dancer=null;this.noteStates=[];
    this.aiInputTimer=0;this.aiInputIdx=0;this.aiSpaceScheduled=false;this.aiSpaceTime=0;this.aiWillMiss=false;
    if(side==='left'){this.themeColor='#4488ff';this.themeName='PLAYER';this.hairCol='#442200';this.outfitCol='#4466ff';this.shoeCol='#ff3366';this.accCol='#ff66aa'}
    else{this.themeColor='#ff4488';this.themeName='CPU';this.hairCol='#331155';this.outfitCol='#cc44ff';this.shoeCol='#44ccff';this.accCol='#44ffcc'}
  }
  reset(){this.score=0;this.combo=0;this.maxCombo=0;this.particles=[];this.fireParticles=[];this.spotlightEffect=null;this.judgmentDisplay=null;this.comboDisplay=null;this.dancer=new Dancer(this)}
  resetRound(round){this.inputIndex=0;this.inputComplete=false;this.spaceProtected=true;this.roundJudged=false;this.currentJudgment=null;this.trackProgress=0;this.trackAfterImages=[];this.noteStates=new Array(round.notes.length).fill('pending');this.aiInputTimer=0;this.aiInputIdx=0;this.aiSpaceScheduled=false;this.aiWillMiss=false;if(this.isAI){const cfg=DIFF_CONFIG[selectedDifficulty];this.aiWillMiss=Math.random()<cfg.judgeDist.miss}if(this.dancer)this.dancer.playAnimation('inputting')}
  getAreaX(){return this.side==='left'?0:HALF_W()}
  getAreaW(){return HALF_W()}
  getCenterX(){return this.getAreaX()+this.getAreaW()/2}
  getBoardW(){return Math.min(280,this.getAreaW()*0.85)}
  getBoardH(){return 80}
  getBoardX(){return this.getCenterX()-this.getBoardW()/2}
  getBoardY(){return H()*0.58}
  getTrackX(){return this.getBoardX()}
  getTrackY(){return this.getBoardY()+this.getBoardH()+20}
  getTrackW(){return this.getBoardW()}
  getTrackH(){return 28}
}

// ========== Dancer ==========
class Dancer{
  constructor(p){
    this.player=p;this.baseX=0;this.baseY=0;
    this.joints={headTilt:0,bodyTilt:0,bodyBend:0,leftArmUpper:-0.3,leftArmLower:0,rightArmUpper:0.3,rightArmLower:0,leftLegUpper:0.1,leftLegLower:0,rightLegUpper:-0.1,rightLegLower:0,hipRotation:0};
    this.targetJoints={...this.joints};
    this.currentAnim='idle';this.animTime=0;this.animDuration=2000;this.glowColor='rgba(100,150,255,0.3)';this.glowIntensity=0;
    this.trailParticles=[];this.jumpY=0;this.spinAngle=0;this.squash=1;this.stretch=1;this.floorSparks=[];
    this.skinColor='#ffddcc';this.hairColor=p.hairCol;this.outfitColor=p.outfitCol;this.shoeColor=p.shoeCol;this.accColor=p.accCol;
    this.aura=0;this.auraColor='#4488ff';
  }
  setPosition(x,y){this.baseX=x;this.baseY=y}
  playAnimation(type){
    this.currentAnim=type;this.animTime=0;
    const m={perfect:[1800,'rgba(255,220,0,0.6)',1],great:[1400,'rgba(68,221,255,0.5)',0.8],good:[1200,'rgba(68,255,136,0.4)',0.5],bad:[1000,'rgba(255,100,68,0.3)',0.3],miss:[1200,'rgba(100,100,100,0.2)',0]};
    const v=m[type];if(v){this.animDuration=v[0];this.glowColor=v[1];this.glowIntensity=v[2]}else{this.animDuration=2000}
  }
  update(dt,ts){
    this.animTime+=dt*1000;const t=this.animTime/this.animDuration,p=Math.min(t,1),pc=this.player.combo;
    switch(this.currentAnim){
      case 'idle':this._idle(ts);break;case 'perfect':this._perfect(p,ts);break;case 'great':this._great(p,ts);break;
      case 'good':this._good(p,ts);break;case 'bad':this._bad(p,ts);break;case 'miss':this._miss(p,ts);break;case 'inputting':this._inputting(ts);break;
    }
    if(p>=1&&this.currentAnim!=='idle'&&this.currentAnim!=='inputting'){this.currentAnim='idle';this.animTime=0}
    for(const k in this.joints)this.joints[k]+=(this.targetJoints[k]-this.joints[k])*Math.min(1,dt*12);
    this.glowIntensity=Math.max(0,this.glowIntensity-dt*0.3);
    for(let i=this.trailParticles.length-1;i>=0;i--){const tp=this.trailParticles[i];tp.life-=dt*tp.decay;tp.x+=tp.vx*dt;tp.y+=tp.vy*dt;tp.vy+=30*dt;if(tp.life<=0)this.trailParticles.splice(i,1)}
    for(let i=this.floorSparks.length-1;i>=0;i--){const s=this.floorSparks[i];s.life-=dt*s.decay;s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=80*dt;if(s.life<=0)this.floorSparks.splice(i,1)}
    if(pc>=3){this.aura=Math.min(1,this.aura+dt*2);this.auraColor=pc>=8?'#ff4400':pc>=5?'#ffaa00':'#4488ff'}else{this.aura=Math.max(0,this.aura-dt*3)}
  }
  _idle(ts){const t=ts*0.001;this.targetJoints.bodyTilt=Math.sin(t*1.5)*0.05;this.targetJoints.bodyBend=0;this.targetJoints.headTilt=Math.sin(t*2)*0.08;this.targetJoints.hipRotation=Math.sin(t*1.2)*0.03;this.targetJoints.leftArmUpper=-0.3+Math.sin(t*1.5)*0.15;this.targetJoints.leftArmLower=Math.sin(t*1.2)*0.1;this.targetJoints.rightArmUpper=0.3+Math.sin(t*1.5+1)*0.15;this.targetJoints.rightArmLower=Math.sin(t*1.2+1)*0.1;this.targetJoints.leftLegUpper=0.05+Math.sin(t*1.5)*0.03;this.targetJoints.leftLegLower=0;this.targetJoints.rightLegUpper=-0.05+Math.sin(t*1.5+Math.PI)*0.03;this.targetJoints.rightLegLower=0;this.jumpY*=0.9;this.spinAngle*=0.9;this.squash+=(1-this.squash)*0.1;this.stretch+=(1-this.stretch)*0.1}
  _inputting(ts){const t=ts*0.001,beat=(ts-gameStartTime)/BEAT_MS,bf=beat%1,b=Math.sin(bf*Math.PI)*0.1;this.targetJoints.bodyTilt=Math.sin(t*3)*0.08;this.targetJoints.bodyBend=-b*0.3;this.targetJoints.headTilt=Math.sin(t*4)*0.1;this.targetJoints.hipRotation=Math.sin(t*3)*0.08;this.targetJoints.leftArmUpper=-0.8+Math.sin(t*3)*0.3;this.targetJoints.leftArmLower=-0.5+Math.sin(t*4)*0.2;this.targetJoints.rightArmUpper=0.8+Math.sin(t*3+Math.PI)*0.3;this.targetJoints.rightArmLower=0.5+Math.sin(t*4+Math.PI)*0.2;this.targetJoints.leftLegUpper=0.05+b*0.5;this.targetJoints.leftLegLower=-b*0.3;this.targetJoints.rightLegUpper=-0.05-b*0.5;this.targetJoints.rightLegLower=b*0.3;this.jumpY=-b*8;this.spinAngle*=0.95}
  _perfect(p,ts){
    if(p<0.15){const s=p/0.15;this.targetJoints.bodyBend=-0.3*s;this.targetJoints.leftLegUpper=0.4*s;this.targetJoints.rightLegUpper=-0.4*s;this.targetJoints.leftLegLower=-0.3*s;this.targetJoints.rightLegLower=0.3*s;this.targetJoints.leftArmUpper=-1.2*s;this.targetJoints.rightArmUpper=1.2*s;this.squash=1+0.15*s;this.stretch=1-0.1*s}
    else if(p<0.55){const s=(p-0.15)/0.4,jc=Math.sin(s*Math.PI);this.jumpY=-jc*55;this.spinAngle=s*Math.PI*4;this.squash=1-0.1*jc;this.stretch=1+0.15*jc;this.targetJoints.bodyBend=0;this.targetJoints.bodyTilt=Math.sin(s*Math.PI*2)*0.2;this.targetJoints.leftArmUpper=-2.5+Math.sin(s*Math.PI*2)*0.5;this.targetJoints.rightArmUpper=2.5+Math.sin(s*Math.PI*2+Math.PI)*0.5;this.targetJoints.leftLegUpper=-0.5+Math.sin(s*Math.PI)*0.8;this.targetJoints.rightLegUpper=0.3;this.targetJoints.headTilt=Math.sin(s*Math.PI*3)*0.15;if(Math.random()<0.4)this._trail('#ffdd00','#ff8800')}
    else if(p<0.75){const s=(p-0.55)/0.2;this.jumpY*=0.7;this.spinAngle*=0.8;this.squash=1+0.2*(1-s);this.stretch=1-0.1*(1-s);this.targetJoints.bodyBend=-0.15*(1-s);this.targetJoints.leftArmUpper=-2.2+s*1.9;this.targetJoints.rightArmUpper=2.2-s*1.5;this.targetJoints.leftLegUpper=0.3*(1-s);this.targetJoints.rightLegUpper=-0.3*(1-s);if(s<0.1)for(let i=0;i<5;i++)this.floorSparks.push({x:this.baseX+(Math.random()-0.5)*25,y:this.baseY,vx:(Math.random()-0.5)*100,vy:-25-Math.random()*50,life:1,decay:2+Math.random(),size:2+Math.random()*2.5,color:'#ffcc00'})}
    else{const s=(p-0.75)/0.25;this.jumpY*=0.9;this.spinAngle*=0.85;this.targetJoints.bodyTilt=0;this.targetJoints.bodyBend=0;this.targetJoints.leftArmUpper=-2.5+(1-Math.abs(Math.sin(s*Math.PI)))*0.3;this.targetJoints.rightArmUpper=2.5-(1-Math.abs(Math.sin(s*Math.PI)))*0.3;this.targetJoints.leftLegUpper=0.15;this.targetJoints.rightLegUpper=-0.15;this.targetJoints.headTilt=-0.1;this.squash+=(1-this.squash)*0.1;this.stretch+=(1-this.stretch)*0.1}
  }
  _great(p,ts){
    if(p<0.2){const s=p/0.2;this.targetJoints.bodyTilt=0.2*s;this.targetJoints.hipRotation=0.15*s;this.targetJoints.leftArmUpper=-0.3-1.5*s;this.targetJoints.rightArmUpper=0.3+0.8*s;this.targetJoints.leftLegUpper=0.1+0.3*s;this.targetJoints.rightLegUpper=-0.1-0.2*s;this.jumpY=-s*18}
    else if(p<0.5){const s=(p-0.2)/0.3;this.targetJoints.bodyTilt=0.2-0.4*s;this.targetJoints.hipRotation=0.15-0.3*s;this.targetJoints.leftArmUpper=-1.8+1.0*s;this.targetJoints.rightArmUpper=1.1-0.3*s;this.targetJoints.leftLegUpper=0.4-0.6*s;this.targetJoints.rightLegUpper=-0.3+0.5*s;this.jumpY=-18+s*18;if(Math.random()<0.25)this._trail('#44ddff','#2288aa')}
    else if(p<0.8){const s=(p-0.5)/0.3;this.targetJoints.bodyTilt=-0.2+0.2*s;this.targetJoints.hipRotation=-0.15+0.15*s;this.targetJoints.leftArmUpper=-0.8+0.3*s;this.targetJoints.rightArmUpper=0.8+0.8*s;this.targetJoints.headTilt=Math.sin(s*Math.PI)*0.2}
    else{const s=(p-0.8)/0.2;this.targetJoints.bodyTilt*=(1-s);this.targetJoints.hipRotation*=(1-s);this.targetJoints.leftArmUpper=-0.5+0.2*s;this.targetJoints.rightArmUpper=1.6-1.3*s;this.targetJoints.headTilt*=(1-s)}
  }
  _good(p){if(p<0.3){const s=p/0.3;this.targetJoints.bodyTilt=0.15*s;this.targetJoints.leftArmUpper=-0.3-0.8*s;this.targetJoints.rightArmUpper=0.3+0.6*s;this.jumpY=-s*10}else if(p<0.6){const s=(p-0.3)/0.3;this.targetJoints.bodyTilt=0.15-0.15*s;this.targetJoints.leftArmUpper=-1.1+0.5*s;this.targetJoints.rightArmUpper=0.9-0.3*s;this.jumpY=-10+s*10}else{const s=(p-0.6)/0.4;this.targetJoints.bodyTilt*=(1-s);this.targetJoints.leftArmUpper+=(-0.3-this.targetJoints.leftArmUpper)*s;this.targetJoints.rightArmUpper+=(0.3-this.targetJoints.rightArmUpper)*s}}
  _bad(p){if(p<0.25){const s=p/0.25;this.targetJoints.bodyTilt=-0.3*s;this.targetJoints.bodyBend=0.2*s;this.targetJoints.leftArmUpper=-0.3-0.5*s;this.targetJoints.rightArmUpper=0.3+1.0*s;this.targetJoints.headTilt=0.2*s}else if(p<0.5){const s=(p-0.25)/0.25;this.targetJoints.bodyTilt=-0.3+0.4*s;this.targetJoints.bodyBend=0.2-0.3*s;this.targetJoints.rightArmUpper=1.3-0.8*s}else{const s=(p-0.5)/0.5;this.targetJoints.bodyTilt*=(1-s);this.targetJoints.bodyBend*=(1-s);this.targetJoints.headTilt*=(1-s);this.targetJoints.leftArmUpper+=(-0.3-this.targetJoints.leftArmUpper)*s*0.5;this.targetJoints.rightArmUpper+=(0.3-this.targetJoints.rightArmUpper)*s*0.5}}
  _miss(p){if(p<0.15){const s=p/0.15;this.targetJoints.headTilt=-0.3*s;this.targetJoints.leftArmUpper=-0.3-1.2*s;this.targetJoints.rightArmUpper=0.3+1.2*s}else if(p<0.5){const s=(p-0.15)/0.35;this.targetJoints.bodyTilt=-0.4*s;this.targetJoints.bodyBend=0.3*s;this.targetJoints.leftLegUpper=0.1+0.5*s;this.targetJoints.rightLegUpper=-0.1+0.3*s;this.targetJoints.leftArmUpper=-1.5+0.3*s;this.targetJoints.rightArmUpper=1.5-0.3*s;this.jumpY=Math.sin(s*Math.PI)*-8}else if(p<0.7){const s=(p-0.5)/0.2;this.targetJoints.bodyBend=0.3+0.2*s;this.targetJoints.bodyTilt=-0.4-0.1*s;this.jumpY=0}else{const s=(p-0.7)/0.3;this.targetJoints.bodyBend*=(1-s*0.7);this.targetJoints.bodyTilt*=(1-s*0.6);this.targetJoints.headTilt*=(1-s*0.5);this.targetJoints.leftArmUpper+=(-0.3-this.targetJoints.leftArmUpper)*s*0.3;this.targetJoints.rightArmUpper+=(0.3-this.targetJoints.rightArmUpper)*s*0.3}}
  _trail(c1,c2){const hY=this.baseY-28+this.jumpY+Math.random()*15,col=Math.random()>0.5?c1:c2;this.trailParticles.push({x:this.baseX+(Math.random()-0.5)*20,y:hY-Math.random()*15,vx:(Math.random()-0.5)*25,vy:-12-Math.random()*20,life:1,decay:1.5+Math.random(),size:1.5+Math.random()*2,color:col})}
  draw(ctx,ts){
    const x=this.baseX,y=this.baseY+this.jumpY,j=this.joints;
    ctx.save();ctx.translate(x,y);ctx.scale(this.squash,this.stretch);
    if(Math.abs(this.spinAngle)>0.01)ctx.rotate(this.spinAngle);
    if(this.aura>0){ctx.save();const ag=ctx.createRadialGradient(0,-24,3,0,-24,40+Math.sin(ts*0.005)*7);ag.addColorStop(0,this.auraColor.replace(')',`,${this.aura*0.3})`).replace('rgb','rgba'));ag.addColorStop(1,'transparent');ctx.fillStyle=ag;ctx.beginPath();ctx.arc(0,-24,40+Math.sin(ts*0.005)*7,0,Math.PI*2);ctx.fill();ctx.restore()}
    if(this.glowIntensity>0.05){ctx.save();ctx.shadowColor=this.glowColor;ctx.shadowBlur=14*this.glowIntensity;ctx.beginPath();ctx.arc(0,-24,24,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${this.glowIntensity*0.1})`;ctx.fill();ctx.restore()}
    ctx.rotate(j.bodyTilt);
    const hs=10,nl=4,tl=20,ual=13,lal=11,ull=14,lll=13;
    ctx.rotate(j.bodyBend);
    // legs

// ========== Two players ==========
let player1=null,player2=null;

// ========== Audio ==========
const AudioCtx=window.AudioContext||window.webkitAudioContext;let audioCtx=null;
function playTick(f=800,d=0.05,v=0.15){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(v,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}
function playBeat(k){playTick(k?600:400,k?0.12:0.06,k?0.25:0.1)}
function playSuccess(){playTick(1200,0.08,0.2)}
function playError(){playTick(200,0.15,0.2)}
function playJudgment(type){const m={perfect:[800,1000,1200],great:[700,900],good:[600,750],bad:[300,250],miss:[200]};(m[type]||[400]).forEach((f,i)=>setTimeout(()=>playTick(f,0.1,0.15),i*60))}
let bgInterval=null,bgBeatIdx=0;
function startBG(){bgBeatIdx=0;if(bgInterval)clearInterval(bgInterval);bgInterval=setInterval(()=>{bgBeatIdx++;playBeat(bgBeatIdx%4===1)},BEAT_MS)}
function stopBG(){if(bgInterval){clearInterval(bgInterval);bgInterval=null}}

// ========== Rounds ==========
function generateRounds(){rounds=[];for(let i=0;i<totalRounds;i++){const lv=Math.min(Math.floor(i/3)+1,9),nc=Math.min(lv+2,12),st=(i>0&&i%7===6),notes=[];for(let j=0;j<nc;j++)notes.push(DIR_KEYS[Math.floor(Math.random()*4)]);rounds.push({level:lv,notes,isShowtime:st})}}

// ========== AI ==========
function updateAI(dt,ts,p2){
  if(gameState!=='roundInput'||p2.roundJudged||currentRound<0||currentRound>=totalRounds)return;
  const round=rounds[currentRound],cfg=DIFF_CONFIG[selectedDifficulty];
  const acc=Math.min(cfg.inputMaxAcc, cfg.inputBaseAcc + currentRound * cfg.inputGrowth);
  const interval=Math.max(cfg.inputMinInterval, cfg.inputBaseInterval - currentRound * cfg.inputSpeedGrowth);
  
  // 如果本轮AI注定miss，故意拖延输入（增大interval倍率），让它来不及
  const effInterval = p2.aiWillMiss ? interval * 2.5 : interval;
  
  if(!p2.inputComplete&&p2.aiInputIdx<round.notes.length){
    p2.aiInputTimer+=dt*1000;
    if(p2.aiInputTimer>=effInterval){p2.aiInputTimer=0;
      // miss模式下降低输入正确率
      const effAcc = p2.aiWillMiss ? acc * 0.4 : acc;
      if(Math.random()<effAcc){p2.noteStates[p2.aiInputIdx]='success';p2.aiInputIdx++;
        if(p2.aiInputIdx>=round.notes.length){p2.inputComplete=true;
          if(p2.aiWillMiss){
            // miss: 不按空格，等轨道走完自然miss
          } else {
            // 非miss: 根据判定分布（去掉miss部分重新归一化）决定判定
            const jType=pickAINonMissJudgment(cfg.judgeDist);
            const tt=roundStartTime+TRACK_DURATION*JUDGE_LINE_RATIO;
            let offset=0;
            if(jType==='perfect') offset=(Math.random()-0.5)*2*JUDGE_PERFECT*0.9;
            else if(jType==='great') offset=(Math.random()>0.5?1:-1)*(JUDGE_PERFECT+1+Math.random()*(JUDGE_GREAT-JUDGE_PERFECT-2));
            else if(jType==='good') offset=(Math.random()>0.5?1:-1)*(JUDGE_GREAT+1+Math.random()*(JUDGE_GOOD-JUDGE_GREAT-2));
            else offset=(Math.random()>0.5?1:-1)*(JUDGE_GOOD+1+Math.random()*(JUDGE_BAD-JUDGE_GOOD-2));
            p2.aiSpaceTime=tt+offset;p2.aiSpaceScheduled=true;
          }
        }}
      else{for(let i=0;i<round.notes.length;i++)p2.noteStates[i]='pending';p2.aiInputIdx=0}
    }
  }
  if(p2.aiSpaceScheduled&&!p2.roundJudged&&ts>=p2.aiSpaceTime){
    p2.aiSpaceScheduled=false;const tt=roundStartTime+TRACK_DURATION*JUDGE_LINE_RATIO,d=Math.abs(ts-tt);
    p2.trackAfterImages.push({progress:p2.trackProgress,alpha:1,time:ts});
    let type;if(d<=JUDGE_PERFECT)type='perfect';else if(d<=JUDGE_GREAT)type='great';else if(d<=JUDGE_GOOD)type='good';else if(d<=JUDGE_BAD)type='bad';else type='miss';
    doPlayerJudgment(p2,type);
  }
}
function pickAINonMissJudgment(dist){
  // 在非miss情况下，根据good/great/perfect比例选择
  const total=dist.good+dist.great+dist.perfect;
  const r=Math.random()*total;
  if(r<dist.good) return 'good';
  if(r<dist.good+dist.great) return 'great';
  return 'perfect';
}

// ========== Game flow ==========
function startGame(){audioCtx=new AudioCtx();document.getElementById('startScreen').style.display='none';gameState='playing';currentRound=-1;player1=new PlayerState('left',false);player2=new PlayerState('right',true);player1.reset();player2.reset();generateRounds();gameStartTime=performance.now();lastBeatTime=gameStartTime;beatCount=0;startBG();setTimeout(()=>nextRound(),MEASURE_MS*1.5)}
let bothTimer=null;
function nextRound(){currentRound++;if(currentRound>=totalRounds){endGame();return}if(bothTimer){clearTimeout(bothTimer);bothTimer=null}const r=rounds[currentRound];player1.resetRound(r);player2.resetRound(r);roundStartTime=performance.now();gameState='roundInput';setTimeout(()=>{if(player1)player1.spaceProtected=false;if(player2)player2.spaceProtected=false},MEASURE_MS/2)}
function doPlayerJudgment(p,type){if(p.roundJudged)return;p.roundJudged=true;p.currentJudgment=type;if(!p.isAI)playJudgment(type);const sm={perfect:1000,great:700,good:400,bad:100,miss:0};let rs=sm[type]||0;if(type==='perfect'){p.combo++;if(p.combo>p.maxCombo)p.maxCombo=p.combo;rs+=p.combo*100;showCombo(p,p.combo)}else{p.combo=0;showJText(p,type)}p.score+=rs;createNoteExplosion(p,type);if(p.combo>=2)createSpotlight(p,p.combo);if(p.dancer)p.dancer.playAnimation(type);checkBoth()}
function checkBoth(){if(player1.roundJudged&&player2.roundJudged){if(bothTimer)clearTimeout(bothTimer);bothTimer=setTimeout(()=>nextRound(),MEASURE_MS*0.8)}}
function endGame(){gameState='finished';stopBG()}

// ========== Input ==========
document.addEventListener('keydown',e=>{
  if(gameState==='finished'){if(e.code==='Space'){document.getElementById('startScreen').style.display='flex';gameState='idle'}return}
  if(gameState!=='roundInput')return;const p=player1;if(p.roundJudged)return;const round=rounds[currentRound];
  if(e.code==='Space'){e.preventDefault();if(p.spaceProtected)return;if(!p.inputComplete){doPlayerJudgment(p,'miss');return}
    const now=performance.now(),tt=roundStartTime+TRACK_DURATION*JUDGE_LINE_RATIO,d=Math.abs(now-tt);
    p.trackAfterImages.push({progress:p.trackProgress,alpha:1,time:now});
    if(d<=JUDGE_PERFECT)doPlayerJudgment(p,'perfect');else if(d<=JUDGE_GREAT)doPlayerJudgment(p,'great');else if(d<=JUDGE_GOOD)doPlayerJudgment(p,'good');else if(d<=JUDGE_BAD)doPlayerJudgment(p,'bad');else doPlayerJudgment(p,'miss');return}
  const dir=DIR_MAP[e.key];if(!dir)return;e.preventDefault();if(p.inputComplete)return;
  if(dir===round.notes[p.inputIndex]){p.noteStates[p.inputIndex]='success';p.inputIndex++;playSuccess();createInputParticle(p,p.inputIndex-1,true);if(p.inputIndex>=round.notes.length)p.inputComplete=true}
  else{playError();createInputParticle(p,p.inputIndex,false);for(let i=0;i<round.notes.length;i++)p.noteStates[i]='pending';p.inputIndex=0}
});

// ========== Main loop ==========
let lastFrame=0;
function gameLoop(ts){
  requestAnimationFrame(gameLoop);const dt=Math.min((ts-(lastFrame||ts))/1000,0.05);lastFrame=ts;
  updateBeat(ts);
  if(player1)updateTrackP(ts,player1);if(player2)updateTrackP(ts,player2);
  if(player2)updateAI(dt,ts,player2);
  if(player1)updatePParts(dt,ts,player1);if(player2)updatePParts(dt,ts,player2);
  [player1,player2].forEach(p=>{if(p&&p.dancer){p.dancer.setPosition(p.getCenterX(),p.getBoardY()-48);p.dancer.update(dt,ts)}});
  ctx.clearRect(0,0,W(),H());drawBG(ts);
  if(gameState==='idle')return;if(gameState==='finished'){drawEndScreen();return}
  [player1,player2].forEach(p=>{if(!p)return;ctx.save();ctx.beginPath();ctx.rect(p.getAreaX(),0,p.getAreaW(),H());ctx.clip();
    drawStageFloor(ts,p);drawSpotP(ts,p);if(p.dancer)p.dancer.draw(ctx,ts);drawFireP(p);drawBoard(ts,p);drawTrack(ts,p);
    if(currentRound>=0&&currentRound<totalRounds&&!p.roundJudged)drawNotes(ts,p);drawPParts(p);drawLvHint(ts,p);drawJText(ts,p);drawPScore(p);drawPLabel(p,ts);ctx.restore()});
  drawDivider(ts);drawRoundInfo(ts);drawScoreBar(ts);
}

function updateBeat(ts){if(gameState==='idle'||gameState==='finished')return;const e=ts-gameStartTime,nb=Math.floor(e/BEAT_MS);if(nb>beatCount){beatCount=nb;lastBeatTime=ts;beatFlash=1;if(beatCount%4===0)keyBeatFlash=1}beatFlash=Math.max(0,beatFlash-0.04);keyBeatFlash=Math.max(0,keyBeatFlash-0.025)}
function updateTrackP(ts,p){if(!p||gameState!=='roundInput'||p.roundJudged)return;p.trackProgress=Math.min((ts-roundStartTime)/TRACK_DURATION,1);if(p.trackProgress>=1&&!p.roundJudged)doPlayerJudgment(p,'miss');const dur=Math.max(1e3,BEAT_MS*3);for(let i=p.trackAfterImages.length-1;i>=0;i--){const img=p.trackAfterImages[i];img.alpha=1-(ts-img.time)/dur;if(img.alpha<=0)p.trackAfterImages.splice(i,1)}}
function updatePParts(dt,ts,p){if(!p)return;for(let i=p.particles.length-1;i>=0;i--){const pt=p.particles[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=80*dt;pt.life-=pt.decay*dt;if(pt.life<=0)p.particles.splice(i,1)}
  if(p.combo<5){p.fireParticles=[];return}const bx=p.getBoardX(),by=p.getBoardY(),bw=p.getBoardW(),bh=p.getBoardH(),rate=p.combo>=8?3:2;
  for(let i=0;i<rate;i++){const s=Math.random();let x,y;if(s<0.3){x=bx+Math.random()*bw;y=by+bh}else if(s<0.6){x=bx;y=by+Math.random()*bh}else{x=bx+bw;y=by+Math.random()*bh}const cols=p.combo>=8?['#ff2200','#ff6600','#ffaa00','#ffdd00','#fff']:['#ff4400','#ff8800','#ffbb00'];p.fireParticles.push({x,y,vx:(Math.random()-0.5)*20,vy:-30-Math.random()*40,life:1,decay:1.5+Math.random(),size:2+Math.random()*3,color:cols[Math.floor(Math.random()*cols.length)]})}
  for(let i=p.fireParticles.length-1;i>=0;i--){const pt=p.fireParticles[i];pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=pt.decay*dt;if(pt.life<=0)p.fireParticles.splice(i,1)}}

// ========== Draw functions ==========
function drawBG(ts){const g=ctx.createLinearGradient(0,0,0,H());g.addColorStop(0,'#0a0a2a');g.addColorStop(0.5,'#0d1035');g.addColorStop(1,'#080820');ctx.fillStyle=g;ctx.fillRect(0,0,W(),H());const t=ts*0.0003;for(let i=0;i<50;i++){const x=(i*137.5+t*10*(i%3+1))%W(),y=(i*97.3)%H(),s=0.5+Math.sin(t+i)*0.5;ctx.fillStyle=`rgba(200,220,255,${0.2+s*0.4})`;ctx.beginPath();ctx.arc(x,y,1+s,0,Math.PI*2);ctx.fill()}const gw=ctx.createRadialGradient(W()/2,H()*0.8,0,W()/2,H()*0.8,W()*0.5);gw.addColorStop(0,`rgba(60,40,120,${0.15+beatFlash*0.1})`);gw.addColorStop(1,'transparent');ctx.fillStyle=gw;ctx.fillRect(0,0,W(),H())}

function drawDivider(ts){const cx=HALF_W();ctx.save();const g=ctx.createLinearGradient(0,0,0,H());g.addColorStop(0,'transparent');g.addColorStop(0.2,`rgba(100,120,200,${0.4+beatFlash*0.2})`);g.addColorStop(0.5,`rgba(140,160,255,${0.6+beatFlash*0.3})`);g.addColorStop(0.8,`rgba(100,120,200,${0.4+beatFlash*0.2})`);g.addColorStop(1,'transparent');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.shadowColor='rgba(100,140,255,0.5)';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H());ctx.stroke();ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='#ff4488';ctx.shadowBlur=15;const vg=ctx.createLinearGradient(cx-15,30,cx+15,30);vg.addColorStop(0,'#ff6688');vg.addColorStop(1,'#ffaa44');ctx.fillStyle=vg;ctx.fillText('VS',cx,30);ctx.restore()}

function drawStageFloor(ts,p){const cx=p.getCenterX(),fy=p.getBoardY()-12;ctx.save();const fg=ctx.createRadialGradient(cx,fy,6,cx,fy,120);fg.addColorStop(0,`rgba(80,100,180,${0.08+beatFlash*0.05})`);fg.addColorStop(0.6,`rgba(40,50,100,${0.03+beatFlash*0.02})`);fg.addColorStop(1,'transparent');ctx.fillStyle=fg;ctx.fillRect(cx-140,fy-3,280,20);ctx.restore()}

function drawSpotP(ts,p){if(!p.spotlightEffect)return;const el=ts-p.spotlightEffect.time,pr=el/p.spotlightEffect.duration;if(pr>=1){p.spotlightEffect=null;return}const a=p.spotlightEffect.intensity*(pr<0.2?pr/0.2:1-(pr-0.2)/0.8),cx=p.getCenterX(),cy=p.getBoardY()+p.getBoardH()/2;ctx.save();const g=ctx.createRadialGradient(cx,cy-120,0,cx,cy,160+p.spotlightEffect.cl*12);g.addColorStop(0,`rgba(255,255,200,${a})`);g.addColorStop(0.5,`rgba(255,255,150,${a*0.3})`);g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(p.getAreaX(),0,p.getAreaW(),H());ctx.restore()}

function drawBoard(ts,p){const bx=p.getBoardX(),by=p.getBoardY(),bw=p.getBoardW(),bh=p.getBoardH(),r=12,gi=0.3+beatFlash*0.3+keyBeatFlash*0.4;ctx.save();ctx.shadowColor=`rgba(68,102,170,${gi})`;ctx.shadowBlur=16+beatFlash*12;rr(bx,by,bw,bh,r);const bg=ctx.createLinearGradient(bx,by,bx,by+bh);const bb=0.85+beatFlash*0.1+keyBeatFlash*0.15;bg.addColorStop(0,`rgba(${0|20*bb},${0|25*bb},${0|65*bb},0.9)`);bg.addColorStop(1,`rgba(${0|15*bb},${0|18*bb},${0|45*bb},0.95)`);ctx.fillStyle=bg;ctx.fill();ctx.strokeStyle=`rgba(80,120,200,${0.4+gi*0.4})`;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();ctx.save();ctx.globalAlpha=0.1+beatFlash*0.05;ctx.strokeStyle='#6688cc';ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(bx+6,by+(bh/4)*i);ctx.lineTo(bx+bw-6,by+(bh/4)*i);ctx.stroke()}ctx.restore();if(p.combo>=5){ctx.save();const c=p.combo>=8?'rgba(255,100,0,0.4)':'rgba(255,150,50,0.25)';ctx.shadowColor=c;ctx.shadowBlur=25+Math.sin(ts*0.005)*10;ctx.strokeStyle=c;ctx.lineWidth=2;rr(bx,by,bw,bh,r);ctx.stroke();ctx.restore()}}

function drawTrack(ts,p){const tx=p.getTrackX(),ty=p.getTrackY(),tw=p.getTrackW(),th=p.getTrackH(),jx=tx+tw*JUDGE_LINE_RATIO,ia=gameState==='roundInput'&&!p.roundJudged;ctx.save();ctx.shadowColor='rgba(50,80,160,0.3)';ctx.shadowBlur=8;rr(tx,ty,tw,th,th/2);const tg=ctx.createLinearGradient(tx,ty,tx,ty+th);tg.addColorStop(0,'rgba(18,22,50,0.92)');tg.addColorStop(1,'rgba(12,15,35,0.95)');ctx.fillStyle=tg;ctx.fill();ctx.strokeStyle=`rgba(70,100,180,${0.35+beatFlash*0.2})`;ctx.lineWidth=1;ctx.stroke();ctx.restore();
  ctx.save();ctx.globalAlpha=0.1;for(let i=1;i<=7;i++){const lx=tx+(tw/8)*i;ctx.beginPath();ctx.moveTo(lx,ty+2);ctx.lineTo(lx,ty+th-2);ctx.strokeStyle='#5577aa';ctx.lineWidth=1;ctx.stroke()}ctx.restore();
  const fl=0.6+Math.sin(ts*0.008)*0.4;ctx.save();ctx.shadowColor=`rgba(255,100,100,${fl*0.5})`;ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(jx,ty+2);ctx.lineTo(jx,ty+th-2);ctx.strokeStyle=`rgba(255,120,120,${fl})`;ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.moveTo(jx,ty-2);ctx.lineTo(jx+3,ty+3);ctx.lineTo(jx,ty+8);ctx.lineTo(jx-3,ty+3);ctx.closePath();ctx.fillStyle=`rgba(255,130,130,${fl})`;ctx.fill();ctx.restore();
  ctx.save();const zw=tw*(JUDGE_BAD/TRACK_DURATION);ctx.globalAlpha=0.05;ctx.fillStyle='#ffaaaa';ctx.fillRect(jx-zw,ty+1,zw*2,th-2);ctx.restore();
  p.trackAfterImages.forEach(img=>{if(img.alpha<=0)return;const cx=tx+tw*img.progress,cy=ty+th/2;ctx.save();ctx.globalAlpha=img.alpha*0.4;ctx.beginPath();ctx.arc(cx,cy,th/2-2,0,Math.PI*2);ctx.fillStyle='#ffcc44';ctx.shadowColor='#ffaa00';ctx.shadowBlur=5;ctx.fill();ctx.restore()});
  if(ia){const cx=tx+tw*p.trackProgress,cy=ty+th/2,rad=th/2-2;ctx.save();ctx.beginPath();ctx.arc(cx,cy,rad+2,0,Math.PI*2);ctx.strokeStyle=p.inputComplete?`rgba(255,200,50,${0.5+Math.sin(ts*0.012)*0.3})`:`rgba(100,180,255,${0.3+Math.sin(ts*0.008)*0.2})`;ctx.lineWidth=1.5;ctx.shadowColor=p.inputComplete?'#ffcc00':'#4488ff';ctx.shadowBlur=p.inputComplete?10:6;ctx.stroke();ctx.restore();ctx.save();const cg=ctx.createRadialGradient(cx-1,cy-1,0,cx,cy,rad);if(p.inputComplete){cg.addColorStop(0,'#fff');cg.addColorStop(0.4,'#ffee44');cg.addColorStop(1,'#ddaa00');ctx.shadowColor='#ffcc00';ctx.shadowBlur=8}else{cg.addColorStop(0,'#fff');cg.addColorStop(0.4,'#66aaff');cg.addColorStop(1,'#3366cc');ctx.shadowColor='#4488ff';ctx.shadowBlur=6}ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.fillStyle=cg;ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.4)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}}

function drawNotes(ts,p){if(currentRound<0||currentRound>=totalRounds)return;const round=rounds[currentRound],bx=p.getBoardX(),by=p.getBoardY(),bw=p.getBoardW(),bh=p.getBoardH(),nw0=34,nh0=34,gap=4;let sc1=1;const tnw=round.notes.length*(nw0+gap)-gap;if(tnw>bw-12)sc1=(bw-12)/tnw;const nw=nw0*sc1,nh=nh0*sc1,gp=gap*sc1;const tw=round.notes.length*(nw+gp)-gp,sx=bx+(bw-tw)/2,ny0=by+(bh-nh)/2,el=ts-roundStartTime;
  round.notes.forEach((dir,i)=>{const st=p.noteStates[i],nx=sx+i*(nw+gp),anim=Math.max(0,Math.min((el-i*18)/200,1)),ao=(1-eob(anim))*12,ny=ny0-Math.max(0,ao),sc=Math.max(0.3,eob(anim));ctx.save();ctx.translate(nx+nw/2,ny+nh/2);ctx.scale(sc,sc);ctx.translate(-(nx+nw/2),-(ny+nh/2));const r=7;rr(nx,ny,nw,nh,r);if(st==='success'){ctx.shadowColor='#ffcc00';ctx.shadowBlur=8;const g=ctx.createLinearGradient(nx,ny,nx,ny+nh);g.addColorStop(0,'#ffee44');g.addColorStop(1,'#ddaa00');ctx.fillStyle=g}else{ctx.shadowColor='#4488ff';ctx.shadowBlur=6;const g=ctx.createLinearGradient(nx,ny,nx,ny+nh);g.addColorStop(0,'#5599ff');g.addColorStop(1,'#3366cc');ctx.fillStyle=g}ctx.fill();ctx.strokeStyle=st==='success'?'rgba(255,238,100,0.8)':'rgba(100,160,255,0.6)';ctx.lineWidth=1.2;ctx.stroke();ctx.fillStyle=st==='success'?'#553300':'#fff';ctx.font=`bold ${Math.floor(16*sc1)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowBlur=0;ctx.fillText(dir,nx+nw/2,ny+nh/2);if(i===p.inputIndex&&!p.inputComplete&&st==='pending'&&!p.isAI){ctx.strokeStyle=`rgba(255,255,255,${0.4+Math.sin(ts*0.008)*0.3})`;ctx.lineWidth=2;rr(nx,ny,nw,nh,r);ctx.stroke()}ctx.restore()})}

function drawLvHint(ts,p){if(currentRound<0)return;const bx=p.getBoardX(),by=p.getBoardY(),x=bx+8,y=by-8;let text='',alpha=1,isST=false;if(gameState==='roundInput'&&!p.roundJudged){const r=rounds[currentRound];if(r.isShowtime){text='SHOW TIME';isST=true}else text=`LV.${String(r.level).padStart(2,'0')}`}else if(currentRound+1<totalRounds){const nr=rounds[currentRound+1];if(nr.isShowtime){text='SHOW TIME';isST=true}else text=`LV.${String(nr.level).padStart(2,'0')}`;alpha=0.4}if(!text)return;ctx.save();ctx.globalAlpha=alpha;if(isST){ctx.font='bold 12px Arial';ctx.textAlign='left';ctx.textBaseline='bottom';ctx.shadowColor='#ff44aa';ctx.shadowBlur=8;ctx.fillStyle='#ff66cc';ctx.fillText(text,x,y)}else{ctx.font='bold 11px Arial';ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillStyle='#88aadd';ctx.fillText(text,x,y)}ctx.restore()}

function drawJText(ts,p){const tx=p.getTrackX(),ty=p.getTrackY(),tw=p.getTrackW(),mx=tx+tw*JUDGE_LINE_RATIO+12,my=ty-10;
  if(p.comboDisplay){const el=ts-p.comboDisplay.time,pr=el/p.comboDisplay.duration;if(pr>=1){p.comboDisplay=null;return}const cnt=p.comboDisplay.count,ph=gcp(cnt),sc=pr<0.15?eob(pr/0.15):1,al=pr>0.7?1-(pr-0.7)/0.3:1;ctx.save();ctx.translate(mx,my);ctx.scale(sc,sc);ctx.globalAlpha=al;ctx.font=`bold ${12+ph*2}px Arial`;ctx.textAlign='left';ctx.textBaseline='middle';ctx.shadowColor=['#ffdd00','#ffaa00','#ff8800','#ff4400','#ff2200','#ff0044'][ph];ctx.shadowBlur=6+ph*4;ctx.fillStyle='#ffdd00';ctx.fillText(`P×${cnt}`,0,0);ctx.restore();return}
  if(p.judgmentDisplay){const el=ts-p.judgmentDisplay.time,pr=el/p.judgmentDisplay.duration;if(pr>=1){p.judgmentDisplay=null;return}const type=p.judgmentDisplay.type,cm={perfect:'#ffdd00',great:'#44ddff',good:'#44ff88',bad:'#ff6644',miss:'#888'},sc=pr<0.15?eob(pr/0.15)*1.1:pr<0.3?1.1-(pr-0.15)/0.15*0.1:1,al=pr>0.6?1-(pr-0.6)/0.4:1;ctx.save();ctx.translate(mx,my);ctx.scale(sc,sc);ctx.globalAlpha=al;ctx.font='bold 16px Arial';ctx.textAlign='left';ctx.textBaseline='middle';ctx.shadowColor=cm[type];ctx.shadowBlur=8;ctx.fillStyle=cm[type];ctx.fillText(type.toUpperCase(),0,0);ctx.restore()}}

function drawPScore(p){const ax=p.getAreaX(),aw=p.getAreaW();ctx.save();ctx.font='bold 20px Arial';ctx.textBaseline='top';ctx.fillStyle='#fff';ctx.shadowColor=p.themeColor;ctx.shadowBlur=6;if(p.side==='left'){ctx.textAlign='left';ctx.fillText(`${p.score}`,ax+12,50);ctx.font='11px Arial';ctx.fillStyle='#8899bb';ctx.shadowBlur=0;if(p.combo>0){ctx.fillStyle='#ffaa44';ctx.fillText(`COMBO ${p.combo}`,ax+12,74)}ctx.fillStyle='#6677aa';ctx.fillText(`MAX ${p.maxCombo}`,ax+12,89)}else{ctx.textAlign='right';ctx.fillText(`${p.score}`,ax+aw-12,50);ctx.font='11px Arial';ctx.fillStyle='#8899bb';ctx.shadowBlur=0;if(p.combo>0){ctx.fillStyle='#ffaa44';ctx.fillText(`COMBO ${p.combo}`,ax+aw-12,74)}ctx.fillStyle='#6677aa';ctx.fillText(`MAX ${p.maxCombo}`,ax+aw-12,89)}ctx.restore()}

function drawPLabel(p,ts){const cx=p.getCenterX();ctx.save();ctx.font='bold 13px Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.shadowColor=p.themeColor;ctx.shadowBlur=8;ctx.fillStyle=p.themeColor;const label=p.isAI?p.themeName+' ('+DIFF_CONFIG[selectedDifficulty].label+')':p.themeName;ctx.fillText(label,cx,10);ctx.restore()}

function drawRoundInfo(ts){ctx.save();ctx.font='11px Arial';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='rgba(150,170,210,0.5)';ctx.fillText(`ROUND ${currentRound+1}/${totalRounds}`,HALF_W(),48);ctx.restore()}

function drawScoreBar(ts){if(!player1||!player2)return;const ts2=player1.score+player2.score;if(ts2===0)return;const bw=Math.min(200,W()*0.15),bh=5,cx=HALF_W(),bx=cx-bw/2,by=64,r1=player1.score/ts2;ctx.save();ctx.globalAlpha=0.7;ctx.fillStyle='rgba(30,30,60,0.5)';ctx.fillRect(bx,by,bw,bh);if(r1>0.01){ctx.fillStyle='#4488ff';ctx.fillRect(bx,by,bw*r1,bh)}if(r1<0.99){ctx.fillStyle='#ff4488';ctx.fillRect(bx+bw*r1,by,bw*(1-r1),bh)}ctx.restore()}

function drawFireP(p){p.fireParticles.forEach(pt=>{ctx.save();ctx.globalAlpha=Math.max(0,pt.life*0.6);ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size*pt.life,0,Math.PI*2);ctx.fillStyle=pt.color;ctx.shadowColor=pt.color;ctx.shadowBlur=5;ctx.fill();ctx.restore()})}
function drawPParts(p){p.particles.forEach(pt=>{ctx.save();ctx.globalAlpha=Math.max(0,pt.life);if(pt.isStar)drawStar(pt.x,pt.y,pt.size,pt.color);else{ctx.beginPath();ctx.arc(pt.x,pt.y,pt.size*pt.life,0,Math.PI*2);ctx.fillStyle=pt.color;ctx.shadowColor=pt.color;ctx.shadowBlur=4;ctx.fill()}ctx.restore()})}
function drawStar(x,y,sz,col){ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();for(let i=0;i<10;i++){const a=(Math.PI*2/10)*i-Math.PI/2,r=i%2===0?sz:sz*0.4;if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}

function drawEndScreen(){
  ctx.save();ctx.fillStyle='rgba(5,5,20,0.88)';ctx.fillRect(0,0,W(),H());const cx=HALF_W(),cy=H()/2;
  ctx.font='bold 42px Arial';ctx.textAlign='center';ctx.textBaseline='middle';const tg=ctx.createLinearGradient(cx-120,cy-120,cx+120,cy-120);tg.addColorStop(0,'#ff66cc');tg.addColorStop(0.5,'#ffaadd');tg.addColorStop(1,'#44ddff');ctx.fillStyle=tg;ctx.shadowColor='#ff66cc';ctx.shadowBlur=20;ctx.fillText('BATTLE RESULT',cx,cy-130);
  // Winner
  const p1=player1.score,p2=player2.score;let winner='';
  if(p1>p2)winner='🎉 YOU WIN!';else if(p2>p1)winner='😤 CPU WINS!';else winner='🤝 DRAW!';
  ctx.font='bold 32px Arial';ctx.fillStyle=p1>p2?'#44ddff':p2>p1?'#ff6688':'#ffdd00';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=15;ctx.fillText(winner,cx,cy-70);
  // Scores
  const lcx=cx-120,rcx=cx+120;
  ctx.font='bold 14px Arial';ctx.fillStyle='#4488ff';ctx.shadowBlur=5;ctx.fillText('PLAYER',lcx,cy-20);
  ctx.fillStyle='#ff4488';ctx.fillText('CPU ('+DIFF_CONFIG[selectedDifficulty].label+')',rcx,cy-20);
  ctx.font='bold 28px Arial';ctx.fillStyle='#fff';ctx.shadowColor='#4488ff';ctx.shadowBlur=8;ctx.fillText(`${player1.score}`,lcx,cy+15);
  ctx.shadowColor='#ff4488';ctx.fillText(`${player2.score}`,rcx,cy+15);
  ctx.font='16px Arial';ctx.fillStyle='#aabbdd';ctx.shadowBlur=0;ctx.fillText(`MAX COMBO: ${player1.maxCombo}`,lcx,cy+50);ctx.fillText(`MAX COMBO: ${player2.maxCombo}`,rcx,cy+50);
  // Grade
  function grade(s){const mx=totalRounds*1800,r=s/mx;if(r>0.95)return'SSS';if(r>0.85)return'SS';if(r>0.75)return'S';if(r>0.6)return'A';if(r>0.45)return'B';return'C'}
  const gc={SSS:'#ffdd00',SS:'#ffaa44',S:'#ff66cc',A:'#44ddff',B:'#44ff88',C:'#aaa'};
  const g1=grade(player1.score),g2=grade(player2.score);
  ctx.font='bold 48px Arial';
  ctx.fillStyle=gc[g1];ctx.shadowColor=gc[g1];ctx.shadowBlur=20;ctx.fillText(g1,lcx,cy+105);
  ctx.fillStyle=gc[g2];ctx.shadowColor=gc[g2];ctx.fillText(g2,rcx,cy+105);
  ctx.font='14px Arial';ctx.fillStyle='#667799';ctx.shadowBlur=0;ctx.fillText('按 空格 重新开始',cx,cy+160);
  ctx.restore();
}

// ========== Particle helpers ==========
function showJText(p,type){p.judgmentDisplay={type,time:performance.now(),duration:700};p.comboDisplay=null}
function showCombo(p,count){p.comboDisplay={count,time:performance.now(),duration:900};p.judgmentDisplay=null}
function gcp(c){if(c>=8)return 5;if(c>=5)return 4;if(c===4)return 3;if(c===3)return 2;if(c===2)return 1;return 0}
function createInputParticle(p,idx,ok){const bx=p.getBoardX(),by=p.getBoardY(),round=rounds[currentRound],nw=34,gap=4;let sc1=1;const tnw=round.notes.length*(nw+gap)-gap;if(tnw>p.getBoardW()-12)sc1=(p.getBoardW()-12)/tnw;const rw=nw*sc1,rg=gap*sc1,tw=round.notes.length*(rw+rg)-rg,sx=bx+(p.getBoardW()-tw)/2,x=sx+idx*(rw+rg)+rw/2,y=by+p.getBoardH()/2;const cnt=ok?6:8,col=ok?'#ffcc00':'#ff4466';for(let i=0;i<cnt;i++){const a=(Math.PI*2/cnt)*i+Math.random()*0.3,sp=ok?(60+Math.random()*40):(50+Math.random()*60);p.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:1.5+Math.random()*0.5,size:ok?(2+Math.random()*2):(1.5+Math.random()*3),color:col})}}
function createNoteExplosion(p,type){const bx=p.getBoardX(),by=p.getBoardY(),cx=bx+p.getBoardW()/2,cy=by+p.getBoardH()/2;if(type==='miss'){for(let i=0;i<10;i++)p.particles.push({x:cx+(Math.random()-0.5)*150,y:cy+(Math.random()-0.5)*20,vx:(Math.random()-0.5)*30,vy:-15-Math.random()*20,life:1,decay:2,size:1.5+Math.random()*2,color:'#666'})}else{const isP=type==='perfect',cnt=isP?35:20,cols=isP?['#ffdd00','#ffaa00','#ff6600','#fff']:['#44ddff','#44ff88','#aaffee','#fff'];for(let i=0;i<cnt;i++){const a=Math.random()*Math.PI*2,sp=50+Math.random()*(isP?130:80);p.particles.push({x:cx+(Math.random()-0.5)*60,y:cy+(Math.random()-0.5)*15,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:isP?1:1.3,size:isP?(2+Math.random()*3):(1.5+Math.random()*3),color:cols[Math.floor(Math.random()*cols.length)]})}if(isP)for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,d=20+Math.random()*50;p.particles.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d*0.4,vx:Math.cos(a)*15,vy:Math.sin(a)*15-20,life:1,decay:0.7,size:1.2+Math.random()*1.5,color:'#fff',isStar:true})}}}
function createSpotlight(p,cc){let i=0.08;if(cc>=8)i=0.3;else if(cc>=5)i=0.22;else if(cc>=4)i=0.17;else if(cc>=3)i=0.12;else if(cc>=2)i=0.1;p.spotlightEffect={time:performance.now(),duration:1200,intensity:i,cl:cc}}

// ========== Utils ==========
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function eob(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)}

// ========== Start ==========
document.getElementById('startBtn').addEventListener('click',startGame);
requestAnimationFrame(gameLoop);
</script>
